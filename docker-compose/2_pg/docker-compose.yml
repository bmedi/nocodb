name: nocodb
services: 
  nocodb: 
    depends_on: 
      root_db: 
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment: 
      NC_DB: "pg://root_db:5432?u=postgres&p=password&d=root_db"
      NC_REDIS_URL: "redis://:redis_password@redis:6379/0"
      NC_S3_BUCKET_NAME: "nocodb"
      NC_S3_REGION: "us-east-1"
      NC_S3_ACCESS_KEY: "minioadmin"
      NC_S3_ACCESS_SECRET: "minioadmin"
      NC_S3_ENDPOINT: "http://minio:9000"
      NC_S3_FORCE_PATH_STYLE: "true"
      # Uncomment and add your license key for Enterprise Edition features
      # NC_LICENSE_KEY: "your-license-key-here"
    image: "nocodb/nocodb:latest"
    ports: 
      - "8080:8080"
    restart: always
    volumes: 
      - "nc_data:/usr/app/data"
    labels:
      com.centurylinklabs.watchtower.scope: nocodb
  
  root_db: 
    environment: 
      POSTGRES_DB: root_db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    healthcheck: 
      interval: 10s
      retries: 10
      test: "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
      timeout: 2s
    image: postgres:16.6
    restart: always
    volumes: 
      - "db_data:/var/lib/postgresql/data"
  
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - "redis_data:/data"
  
  minio:
    image: minio/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "minio_data:/data"
  
  watchtower:
    # Maintained drop-in fork; containrrr/watchtower is archived and breaks on
    # Docker Engine v29+/OrbStack (requires API >= 1.40, old image pins 1.25).
    image: nickfedor/watchtower:latest
    restart: always
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "86400"
      WATCHTOWER_INCLUDE_STOPPED: "false"
      WATCHTOWER_REVIVE_STOPPED: "false"
      WATCHTOWER_NOTIFICATION_URL: ""
      TZ: "America/New_York"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.scope: nocodb
    command: --scope nocodb

volumes: 
  db_data: {}
  nc_data: {}
  redis_data: {}
  minio_data: {}
